# Atividade Prática Avaliativa - Introdução à Cloud: Kubernetes
# Aplicação: task-manager (Next.js + PostgreSQL)

# ConfigMap
# Guarda as variáveis de ambiente de conexão com o banco, injetadas no Deployment do task-manager.

apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
data:
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "task_manager"
  DATABASE_USER: "admin"
  DATABASE_PASSWORD: "admin"
  PORT: "3000"

---
#Deployment do Postgres
#Necessário para a aplicação funcionar 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: task-manager-config
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_DB
              value: "task_manager"

---
# Service do Postgres
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# Deployment do task-manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
        - name: task-manager
          image: task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: task-manager-config

---
#Service do task-manager
# Item 2
apiVersion: v1
kind: Service
metadata:
  name: task-manager-service
spec:
  type: NodePort
  selector:
    app: task-manager
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
