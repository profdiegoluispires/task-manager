name: CI/CD Task Manager

on:
  push:
    branches:
      - main
      - dev_atividadeAvaliativa
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes da aplicação
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d task_manager"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Inicializar banco de dados
        run: node init-db.js
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Iniciar aplicação
        run: npm run dev > app.log 2>&1 &
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log || true
          exit 1

      - name: Executar testes
        run: npm test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: task_manager
          DATABASE_USER: admin
          DATABASE_PASSWORD: admin

      - name: Publicar logs da aplicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app.log
          if-no-files-found: ignore

  docker:
    name: Build e publicação da imagem Docker
    runs-on: ubuntu-latest
    needs: test

    steps:

      # ==========================================================
      # 1. Baixar o código
      # ==========================================================
      - name: Checkout do código
        uses: actions/checkout@v5


      # ==========================================================
      # 2. Login no Docker Hub
      # ==========================================================
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # 3. Configurar Docker Buildx
      # ==========================================================
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================================
      # 4. Build e Push da imagem
      # ==========================================================
      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager:${{ github.sha }}


      # ==========================================================
      # 5. Verificar imagem publicada
      # ==========================================================
      - name: Exibir imagem publicada
        run: |
          echo "========================================"
          echo "Imagem Docker publicada com sucesso!"
          echo "========================================"
          echo "Docker Hub:"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/task-manager:latest"
          echo ""
          echo "Tag do commit:" 
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/task-manager:${{ github.sha }}"